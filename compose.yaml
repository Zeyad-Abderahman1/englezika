services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-englizeka}
      POSTGRES_USER: ${POSTGRES_USER:-englizeka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-englizeka_local_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - englizeka_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-englizeka} -d ${POSTGRES_DB:-englizeka}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  englizeka_postgres_data:
