name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, staging, develop ]
  pull_request:
    branches: [ main, master, staging, develop ]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build Platform Bundle
        run: npm run build
        env:
          VERIFICATION_SECRET: 'ci-pipeline-verification-secret-key-32-chars-long'

      - name: Run Tests
        run: npm test
        env:
          VERIFICATION_SECRET: 'ci-pipeline-verification-secret-key-32-chars-long'

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high --omit=dev || true

  deploy-staging:
    name: Deploy to Staging Environment
    needs: build-and-test
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers (Staging)
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

