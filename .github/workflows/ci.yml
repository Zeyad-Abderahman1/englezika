name: Node and PostgreSQL CI

on:
  push:
    branches: [main, master, staging, develop]
  pull_request:
    branches: [main, master, staging, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: englizeka_test
          POSTGRES_USER: englizeka
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U englizeka -d englizeka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://englizeka:test-only-password@127.0.0.1:5432/englizeka_test
      PRIVATE_STORAGE_DIR: ${{ github.workspace }}/storage/private
      VERIFICATION_SECRET: ci-verification-secret-that-is-long-enough
      VIDEO_RESOLVE_SECRET: ci-video-secret-that-is-long-enough
      EMAIL_TEST_MODE: 'true'
      INITIAL_STAFF_EMAIL: bootstrap@example.test
      INITIAL_STAFF_NAME: CI Bootstrap Staff
      INITIAL_STAFF_PASSWORD_HASH: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      INITIAL_STAFF_PASSWORD_SALT: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      INITIAL_STAFF_PASSWORD_ITERATIONS: '100000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit, security and build tests
        run: npm test

      - name: Live platform test
        run: npm run test:e2e

      - name: Dependency audit
        run: npm audit --audit-level=high --omit=dev || true
