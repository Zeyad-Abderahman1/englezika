# ==============================================================================
# Englizeka — Production Nginx Configuration (aaPanel / Native Nginx)
# ==============================================================================
# Canonical Domain: https://englezika.com
# Secondary Domain: https://www.englezika.com (301 Permanent Redirect)
# Upstream Service: Standalone Node.js Cluster on http://127.0.0.1:3000
# ==============================================================================

# 1. HTTP Redirect (Port 80 -> HTTPS Canonical)
server {
    listen 80;
    listen [::]:80;
    server_name englezika.com www.englezika.com;

    # ACME / Let's Encrypt challenge requests
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://englezika.com$request_uri;
    }
}

# 2. Secondary HTTPS Redirect (Port 443 www -> Canonical Non-www)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.englezika.com;

    # SSL Certificates (Let's Encrypt / Certbot paths)
    ssl_certificate /etc/letsencrypt/live/englezika.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/englezika.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    return 301 https://englezika.com$request_uri;
}

# 3. Primary Canonical HTTPS Application Server (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name englezika.com;

    # SSL Certificates (Let's Encrypt / Certbot paths)
    ssl_certificate /etc/letsencrypt/live/englezika.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/englezika.com/privkey.pem;

    # Modern TLS Protocol & Cipher Suite (Mozilla Intermediate Recommendation)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers (HSTS with subdomains and preload)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload Payload Size Limit (supports 20MB PDFs & birth certificates)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Deny direct access to private storage and dotfiles / hidden files
    location ^~ /storage/private/ {
        deny all;
        return 404;
    }

    location ~ /\.(env|git|ht) {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    # Static assets caching (Next.js immutable hashed chunks)
    location ^~ /_next/static/ {
        alias /var/www/englizeka/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Main Application Proxy -> Node.js Standalone on 127.0.0.1:3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket / Streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forwarded Client Identity & Scheme Headers (Critical for TRUSTED_PROXY_IP_HEADER=x-real-ip & HTTPS cookies)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy Buffering & Timeouts
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
